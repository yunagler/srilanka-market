<body>
<header class="top"><div class="wrap">
  <a class="brand" data-internal="index.html" href="index.html"><i></i><span data-i18n="brand"></span></a>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="si">සිං</button><button type="button" data-lang="ta">தமிழ்</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="he">עב</button></div>
</div></header>
<nav class="menu"><div class="wrap"><a data-internal="index.html" href="index.html" data-i18n="nav_home"></a><a data-internal="work.html" href="work.html" data-i18n="nav_work"></a><a data-internal="shop.html" href="shop.html" data-i18n="nav_shop"></a><a data-internal="trips.html" href="trips.html" data-i18n="nav_trips"></a><a data-internal="services.html" href="services.html" data-i18n="nav_services"></a><a data-internal="about.html" href="about.html" data-i18n="nav_about"></a><a data-internal="survey.html" href="survey.html" data-i18n="nav_survey" aria-current="page"></a><a data-internal="register.html" href="register.html" data-i18n="nav_register"></a></div></nav>
<main><div class="wrap">
    <h1 data-i18n="sv_title"></h1><p class="lead" data-i18n="sv_lead"></p>
    <form id="survey" class="card" autocomplete="on">
      <label><span data-i18n="sv_city"></span><input id="sv-city" maxlength="80"></label>
      <div class="row"><label><span data-i18n="sv_day"></span><select id="sv-day"></select></label><label><span data-i18n="sv_spend"></span><select id="sv-spend"></select></label></div>
      <label><span data-i18n="sv_buy"></span><input id="sv-buy" maxlength="160"></label>
      <div><div style="font-size:14px;color:var(--muted);margin-bottom:4px" data-i18n="sv_products"></div><div class="checks" id="sv-products"></div></div>
      <label><span data-i18n="sv_missing"></span><textarea id="sv-missing" rows="3" maxlength="600"></textarea></label>
      <label><span data-i18n="sv_pay"></span><select id="sv-pay"></select></label>
      <label class="consent"><input id="sv-host" type="checkbox"><span data-i18n="sv_host"></span></label>
      <div class="row"><label><span data-i18n="sv_name"></span><input id="sv-name" maxlength="120" autocomplete="name"></label><label><span data-i18n="sv_phone"></span><input id="sv-phone" type="tel" inputmode="tel" maxlength="20" placeholder="05x-xxxxxxx" autocomplete="tel"></label></div>
      <label><span data-i18n="sv_note"></span><textarea id="sv-note" rows="2" maxlength="400"></textarea></label>
      <label class="consent"><input id="sv-consent" type="checkbox"><span data-i18n="sv_consent"></span></label>
      <input id="sv-website" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <div class="err" id="sv-err" aria-live="polite"></div>
      <button class="cta" type="submit" data-i18n="sv_btn"></button>
      <a id="sv-wa" class="more" href="#" target="_blank" rel="noopener" hidden data-i18n="sv_wa"></a>
    </form>
    <div class="card" id="sv-ok" hidden><b data-i18n="sv_ok_t"></b><p data-i18n="sv_ok"></p></div>
    <div class="num" data-num></div>
</div></main>
<footer><div class="wrap"><div data-i18n="foot1"></div><div data-i18n="foot2"></div><div><a data-internal="privacy.html" href="privacy.html" data-i18n="foot_privacy"></a> &middot; <a data-wa href="#" target="_blank" rel="noopener">WhatsApp</a></div></div></footer>
<script src="assets/site.js"></script>

</html>
